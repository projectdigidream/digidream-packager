# The Tauri RUNNER: one program per OS, compiled once per engine version into a
# packager kit, that runs ANY game the packager lays beside it (game/). See
# src/main.rs. Not rebuilt per game: the packager only renames it, sets its
# icon and (macOS) signs it.
[package]
name = "digidream-runner"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
